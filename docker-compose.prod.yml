services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: japan_imports_backend_prod
    restart: always
    env_file:
      - .env.production
    networks:
      - japan_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend-redesign
      dockerfile: Dockerfile
    container_name: japan_imports_frontend_prod
    restart: always
    networks:
      - japan_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: japan_imports_nginx_prod
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - japan_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  japan_network:
    driver: bridge

volumes:
  certbot_www:
