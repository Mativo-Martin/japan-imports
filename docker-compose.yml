services:
  db:
    image: postgres:15-alpine
    container_name: japan_imports_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-japan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-japan_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-japan_imports_dev}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-japan_user} -d ${POSTGRES_DB:-japan_imports_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - japan_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: japan_imports_backend
    restart: always
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - japan_network

  frontend:
    build:
      context: ./frontend-redesign
      dockerfile: Dockerfile
    container_name: japan_imports_frontend
    restart: always
    ports:
      - "5173:80"
    env_file:
      - ./.env
    depends_on:
      - backend
    networks:
      - japan_network

  nginx:
    image: nginx:alpine
    container_name: japan_imports_nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - japan_network

networks:
  japan_network:
    driver: bridge

volumes:
  pg_data:
